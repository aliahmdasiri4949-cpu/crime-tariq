<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>المحقق طارق - لوحة القضية</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="hub-body">
    <div class="overlay"></div>
    <div class="hub-container" style="padding-top: 40px; margin-bottom: 50px;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="color: var(--accent-red); text-shadow: 0 0 10px rgba(230,57,70,0.5);"><i class="fas fa-folder-open"></i> ملف القضية</h1>
            <a href="cases_hub.html" class="btn btn-dark" style="width: auto; padding: 8px 15px;"><i class="fas fa-home"></i> العودة</a>
        </div>

        <div class="case-card" style="margin-bottom: 30px; position: relative;">
            <div class="case-header">
                <span class="badge" id="dashboardCaseId">CASE #</span>
            </div>
            <div class="case-body">
                <h2 id="dashboardCaseTitle" style="font-size: 28px; margin-bottom: 15px;">جاري التحميل...</h2>
                <p id="dashboardCaseDesc" style="color: #cbd5e1; font-size: 15px; line-height: 1.6;"></p>
                <div style="margin-top: 20px;">
                    <button id="playEvidenceBtn" class="btn btn-red" style="width: auto; padding: 10px 20px; font-size: 14px;"><i class="fas fa-headphones"></i> استمع للدليل الصوتي</button>
                    <span id="evidenceHint" style="font-size: 12px; color: var(--text-secondary); margin-right: 10px;">(اضغط للاستماع)</span>
                </div>
            </div>
        </div>

        <h3 style="color: var(--text-secondary); margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
            <i class="fas fa-users"></i> المشتبه بهم
        </h3>
        
        <div id="suspectsList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px;">
            <!-- Suspects will be injected here -->
        </div>

    </div>

    <script src="cases_data.js?v=3"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const caseId = urlParams.get('case') || '1';
        const caseInfo = casesData[caseId];

        if(caseInfo) {
            document.getElementById('dashboardCaseId').textContent = 'CASE #0' + caseId;
            document.getElementById('dashboardCaseTitle').textContent = caseInfo.title;
            document.getElementById('dashboardCaseDesc').textContent = caseInfo.description;

            const suspectsList = document.getElementById('suspectsList');
            caseInfo.suspects.forEach((suspect, index) => {
                const card = document.createElement('div');
                card.className = 'case-card suspect-card-anim';
                card.style.display = 'flex';
                card.style.justifyContent = 'space-between';
                card.style.alignItems = 'center';
                card.style.animationDelay = `${index * 0.1}s`;
                
                card.innerHTML = `
                    <div style="display: flex; gap: 15px; align-items: center; max-width: 70%;">
                        <img src="${suspect.avatar}" alt="${suspect.name}" style="width: 70px; height: 70px; border-radius: 10px; object-fit: cover; border: 2px solid var(--border-color);">
                        <div>
                            <h3 style="margin-bottom: 5px; font-size: 18px;">${suspect.name} <span style="font-size: 13px; color: var(--accent-red); font-weight: normal;">(${suspect.role})</span></h3>
                            <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.4;">${suspect.desc}</p>
                        </div>
                    </div>
                    <a href="chat.html?case=${caseId}&suspect=${suspect.id}" class="btn btn-red" style="width: auto; padding: 10px 15px; font-size: 13px; white-space: nowrap;"><i class="fas fa-comments"></i> استجواب</a>
                `;
                suspectsList.appendChild(card);
            });

            // Audio Evidence Logic
            const playEvidenceBtn = document.getElementById('playEvidenceBtn');
            const evidenceHint = document.getElementById('evidenceHint');
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            playEvidenceBtn.addEventListener('click', () => {
                audioCtx.resume();
                playEvidenceBtn.disabled = true;
                evidenceHint.textContent = "جاري التشغيل...";
                
                const type = caseInfo.evidenceType || 'voices';
                
                if (type === 'gunshot') {
                    playGunshot();
                } else if (type === 'stab') {
                    playStab();
                } else if (type === 'glass_break') {
                    playGlassBreak();
                } else if (type === 'door_knock') {
                    playDoorKnock();
                } else {
                    playVoices(caseInfo.evidencePhrase || "لا تفعل ذلك!");
                }

                setTimeout(() => {
                    playEvidenceBtn.disabled = false;
                    evidenceHint.textContent = "(انتهى التشغيل)";
                }, 3000);
            });

            function playGunshot() {
                const bufferSize = audioCtx.sampleRate * 1.5; // 1.5 seconds
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(4000, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
                
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(2.0, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                
                noise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                noise.start();
            }

            function playStab() {
                // Swish noise
                const osc = audioCtx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
                
                // Thud
                setTimeout(() => {
                    const thudOsc = audioCtx.createOscillator();
                    thudOsc.type = 'sine';
                    thudOsc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    thudOsc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
                    
                    const thudGain = audioCtx.createGain();
                    thudGain.gain.setValueAtTime(1.5, audioCtx.currentTime);
                    thudGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    
                    thudOsc.connect(thudGain);
                    thudGain.connect(audioCtx.destination);
                    thudOsc.start();
                    thudOsc.stop(audioCtx.currentTime + 0.3);
                }, 150);
            }

            function playGlassBreak() {
                const bufferSize = audioCtx.sampleRate * 0.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 5000;
                
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(1.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                
                noise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                noise.start();
            }

            function playDoorKnock() {
                let time = audioCtx.currentTime;
                for (let i = 0; i < 3; i++) {
                    const osc = audioCtx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(100, time);
                    osc.frequency.exponentialRampToValueAtTime(40, time + 0.1);
                    
                    const gainNode = audioCtx.createGain();
                    gainNode.gain.setValueAtTime(1.5, time);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
                    
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    osc.start(time);
                    osc.stop(time + 0.1);
                    time += 0.25; // delay between knocks
                }
            }

            function playVoices(phrase) {
                if ('speechSynthesis' in window) {
                    const msg = new SpeechSynthesisUtterance();
                    msg.text = phrase;
                    msg.lang = 'ar-SA';
                    msg.rate = 1.1; 
                    msg.pitch = 0.5; // lower pitch to sound less robotic
                    window.speechSynthesis.speak(msg);
                } else {
                    playGunshot();
                }
            }
        }
    </script>
</body>
</html>
